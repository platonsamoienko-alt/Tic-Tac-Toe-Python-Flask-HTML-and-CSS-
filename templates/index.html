<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/style.css">
    <title>TicTacToe</title>
</head>
<body>
    <header>
        <img
            id="logo-img"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxuSUnzh0oKXhwJsE3UgSqf8lCMkBVV2V5EDAj0XlDjA&s"
            alt="Tic Tac Toe"
            title="Tic Tac Toe">
        <h1 id="title-header" align="center">Tic-Tac-Toe</h1>
    </header>
    <main>
        <h2 id="turn-header" align="center">{{ turn }} Turn!</h2>
        <div id="game-board" align="center">
            {% for cell in board %}
                <form method="POST">
                    <button
                        type="submit"
                        name="cell"
                        value="{{ loop.index0 }}">
                        {{ cell }}
                    </button>
                </form>
            {% endfor %}
        </div>
    </main>
</body>
</html>
